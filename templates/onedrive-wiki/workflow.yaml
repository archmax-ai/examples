title: OneDrive wiki
instructions: |-
  You keep a wiki in the user's OneDrive: Markdown pages in the folder Wiki, which you write
  and maintain from the documents that arrive in Wiki/Inbox. Wiki/index.md lists every page
  with a one-line summary, and Wiki/log.md records every change, newest first. Link pages to
  each other with relative Markdown links, name the source document of every fact, and never
  invent one.
runtime:
  engine: archmax-harness
  version: "2"
tools:
  allow_always:
    - ls
    - read_file
    - write_file
    - edit_file
    - glob
    - grep
    - copy_file
    - move_file
    - remove_file
    - write_todos
    - archmax_eval
    - archmax_run
metadata:
  notes:
    - id: n1
      text: |-
        To do: connect Microsoft OneDrive, and create a folder Wiki in it holding the folders Inbox, sources and topics.
      x: 448
      y: 0
      width: 288
      height: 144
      color: amber
    - id: n2
      text: |-
        To do: on the New File trigger of Ingest a document, pick Wiki/Inbox as the folder to watch. Every file dropped there becomes wiki pages.
      x: 448
      y: 176
      width: 288
      height: 160
      color: amber
    - id: n3
      text: |-
        Ask the wiki answers from the pages Ingest a document wrote, and links them. Ask it to keep a good answer as a page of its own.
      x: 448
      y: 368
      width: 288
      height: 144
      color: blue
states:
  ingest:
    title: Ingest a document
    triggers:
      new-file:
        type: ap
        piece: microsoft-onedrive
        trigger: new_file
    instructions: |-
      A document arrived in the watched folder; the firing names it, with its id and its folder.

      1. Download the document and read it.
      2. Write its summary page, Wiki/sources/<document name>.md: what the document is, its key
         points, and a link to the original.
      3. Update each topic page under Wiki/topics/ that the document touches, or create one for
         a topic the wiki lacks. Add what is new, keep what is still true, and where the
         document contradicts a page, say so on the page rather than overwrite it.
      4. List every new page in Wiki/index.md, and add one line to the top of Wiki/log.md: the
         date, the document, and the pages you changed.

      Read a page before you replace it, and change only what the document changes.
    tools:
      allow:
        - tool: microsoft-onedrive__onedrive_download_file
          source: ap
        - tool: microsoft-onedrive__onedrive_get_item
          source: ap
        - tool: microsoft-onedrive__onedrive_search_items
          source: ap
        - tool: microsoft-onedrive__onedrive_list_folder_children
          source: ap
        - tool: microsoft-onedrive__onedrive_create_text_file
          source: ap
        - tool: microsoft-onedrive__onedrive_replace_file_content
          source: ap
    metadata:
      x: 0
      y: 40
      color: purple
      icon: BookPlus
  ask:
    title: Ask the wiki
    triggers:
      chat:
        session: triggers.-1.threadId
        examples:
          - What does the wiki say about our onboarding process?
          - Which documents mention the budget for next year?
          - What changed in the wiki this week?
    instructions: >-
      Answer from the wiki; the prompt includes the conversation so far. Read Wiki/index.md,
      open the pages it points to, and answer with links to those pages and the documents they
      cite. When the wiki does not cover the question, say so and name the kind of document
      that would. When an answer is worth keeping and the user agrees, save it as a page under
      Wiki/topics/, list it in the index and log it. This state has no transitions, so each
      answer ends the turn and the next message continues here.
    tools:
      allow:
        - tool: microsoft-onedrive__onedrive_search_items
          source: ap
        - tool: microsoft-onedrive__onedrive_list_folder_children
          source: ap
        - tool: microsoft-onedrive__onedrive_download_file
          source: ap
        - tool: microsoft-onedrive__onedrive_create_text_file
          source: ap
        - tool: microsoft-onedrive__onedrive_replace_file_content
          source: ap
    metadata:
      x: 0
      y: 280
      color: blue
      icon: BookOpen
